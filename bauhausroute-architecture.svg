<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">BauhausRoute 系統架構圖</title>
  <desc id="desc">BauhausRoute Android App 的使用者、Compose UI、本機邏輯、Room Database 與外部服務架構圖。</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#334155" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 48px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 22px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #475569; }
      .panel-title { font: 800 26px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 800 22px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 500 17px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #334155; }
      .note { font: 500 15px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #dbe7e2; stroke-width: 1.5; rx: 26; filter: url(#shadow); }
      .box { stroke: rgba(15,23,42,0.08); stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .soft-arrow { fill: none; stroke: #64748b; stroke-width: 2.4; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .pill-text { font: 800 18px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1100"/>
  <rect x="0" y="0" width="1800" height="1100" fill="#edf7f2" opacity="0.85"/>

  <text x="80" y="78" class="title">BauhausRoute 系統架構圖</text>
  <text x="80" y="118" class="subtitle">Android / Kotlin / Jetpack Compose / Room / osmdroid / OSRM / 中央氣象署 Open Data</text>

  <!-- Column panels -->
  <rect x="70" y="170" width="250" height="810" class="panel"/>
  <rect x="365" y="170" width="360" height="810" class="panel"/>
  <rect x="770" y="170" width="330" height="810" class="panel"/>
  <rect x="1145" y="170" width="300" height="810" class="panel"/>
  <rect x="1490" y="170" width="240" height="810" class="panel"/>

  <text x="105" y="220" class="panel-title">使用者角色</text>
  <text x="400" y="220" class="panel-title">Android App / UI</text>
  <text x="805" y="220" class="panel-title">本機邏輯</text>
  <text x="1180" y="220" class="panel-title">Room Database</text>
  <text x="1520" y="220" class="panel-title">外部服務</text>

  <!-- Users -->
  <rect x="105" y="285" width="180" height="72" class="box" fill="#1f9d73"/>
  <text x="158" y="329" class="pill-text">農民</text>
  <rect x="105" y="430" width="180" height="72" class="box" fill="#2563eb"/>
  <text x="143" y="474" class="pill-text">清運團隊</text>
  <rect x="105" y="575" width="180" height="72" class="box" fill="#7c3aed"/>
  <text x="158" y="619" class="pill-text">管理者</text>

  <!-- App/UI -->
  <rect x="405" y="270" width="280" height="105" class="box" fill="#e0f2fe"/>
  <text x="430" y="307" class="box-title">MainActivity</text>
  <text x="430" y="338" class="box-text">App 入口、流程組裝</text>
  <text x="430" y="364" class="box-text">登入狀態與角色切換</text>

  <rect x="405" y="420" width="280" height="120" class="box" fill="#dcfce7"/>
  <text x="430" y="457" class="box-title">登入 / 註冊流程</text>
  <text x="430" y="488" class="box-text">帳密登入、Google 登入</text>
  <text x="430" y="514" class="box-text">農民 / 清運 / 管理角色</text>

  <rect x="405" y="585" width="280" height="135" class="box" fill="#fef3c7"/>
  <text x="430" y="622" class="box-title">Jetpack Compose UI</text>
  <text x="430" y="653" class="box-text">Home / Status / Settings</text>
  <text x="430" y="679" class="box-text">Detail、Dashboard</text>
  <text x="430" y="705" class="box-text">Navigation Compose</text>

  <rect x="405" y="765" width="280" height="135" class="box" fill="#ede9fe"/>
  <text x="430" y="802" class="box-title">地圖 / 照片 / 天氣 UI</text>
  <text x="430" y="833" class="box-text">osmdroid 地圖顯示</text>
  <text x="430" y="859" class="box-text">Photo Picker、EXIF GPS</text>
  <text x="430" y="885" class="box-text">WeatherSnapshot</text>

  <!-- Domain -->
  <rect x="810" y="270" width="250" height="105" class="box" fill="#e0f2fe"/>
  <text x="835" y="307" class="box-title">FarmerLocalStore</text>
  <text x="835" y="338" class="box-text">UserRole</text>
  <text x="835" y="364" class="box-text">Farmer / Google profile</text>

  <rect x="810" y="430" width="250" height="105" class="box" fill="#dcfce7"/>
  <text x="835" y="467" class="box-title">RoutePlanner</text>
  <text x="835" y="498" class="box-text">最近鄰排序</text>
  <text x="835" y="524" class="box-text">座標距離計算</text>

  <rect x="810" y="590" width="250" height="105" class="box" fill="#ffedd5"/>
  <text x="835" y="627" class="box-title">RoadRouteService</text>
  <text x="835" y="658" class="box-text">OSRM 路線查詢</text>
  <text x="835" y="684" class="box-text">失敗時 fallback</text>

  <rect x="810" y="750" width="250" height="105" class="box" fill="#ffe4e6"/>
  <text x="835" y="787" class="box-title">CwaWeatherService</text>
  <text x="835" y="818" class="box-text">地址 / GPS 對應縣市</text>
  <text x="835" y="844" class="box-text">CWA JSON 解析</text>

  <!-- Data -->
  <rect x="1185" y="270" width="220" height="95" class="box" fill="#e0f2fe"/>
  <text x="1210" y="306" class="box-title">Database</text>
  <text x="1210" y="337" class="box-text">farmland_inspections.db</text>

  <rect x="1185" y="420" width="220" height="70" class="box" fill="#dbeafe"/>
  <text x="1248" y="463" class="box-title">UserDao</text>
  <rect x="1185" y="530" width="220" height="70" class="box" fill="#dcfce7"/>
  <text x="1238" y="573" class="box-title">FarmerDao</text>
  <rect x="1185" y="640" width="220" height="70" class="box" fill="#ede9fe"/>
  <text x="1235" y="683" class="box-title">CleanerDao</text>

  <rect x="1185" y="765" width="220" height="135" class="box" fill="#f8fafc"/>
  <text x="1210" y="802" class="box-title">Tables</text>
  <text x="1210" y="833" class="box-text">user_accounts</text>
  <text x="1210" y="859" class="box-text">farmland_inspections</text>
  <text x="1210" y="885" class="box-text">team_profiles / tasks</text>

  <!-- External -->
  <rect x="1525" y="285" width="170" height="70" class="box" fill="#0ea5e9"/>
  <text x="1547" y="328" class="pill-text">Google ID</text>
  <rect x="1525" y="430" width="170" height="70" class="box" fill="#16a34a"/>
  <text x="1540" y="473" class="pill-text">CWA API</text>
  <rect x="1525" y="575" width="170" height="70" class="box" fill="#ea580c"/>
  <text x="1555" y="618" class="pill-text">OSRM</text>
  <rect x="1525" y="720" width="170" height="70" class="box" fill="#475569"/>
  <text x="1556" y="763" class="pill-text">OSM</text>
  <rect x="1525" y="850" width="170" height="70" class="box" fill="#64748b"/>
  <text x="1540" y="893" class="pill-text">Location / Media</text>

  <!-- Arrows -->
  <path class="arrow" d="M285 321 C335 321 350 322 405 322"/>
  <path class="arrow" d="M285 466 C335 466 350 480 405 480"/>
  <path class="arrow" d="M285 611 C335 611 350 480 405 480"/>

  <path class="arrow" d="M685 322 C725 322 760 322 810 322"/>
  <path class="arrow" d="M685 480 C725 480 760 322 810 322"/>
  <path class="arrow" d="M685 653 C730 653 760 482 810 482"/>
  <path class="arrow" d="M685 833 C730 833 760 642 810 642"/>
  <path class="arrow" d="M685 833 C730 833 760 802 810 802"/>

  <path class="arrow" d="M685 480 C885 480 1050 455 1185 455"/>
  <path class="arrow" d="M685 653 C870 653 1030 565 1185 565"/>
  <path class="arrow" d="M685 653 C870 653 1030 675 1185 675"/>

  <path class="soft-arrow" d="M1060 642 C1245 642 1380 610 1525 610"/>
  <path class="soft-arrow" d="M1060 802 C1245 802 1380 465 1525 465"/>
  <path class="soft-arrow" d="M685 833 C1000 833 1290 755 1525 755"/>
  <path class="soft-arrow" d="M685 833 C1000 833 1290 885 1525 885"/>
  <path class="soft-arrow" d="M685 480 C1000 480 1290 320 1525 320"/>

  <path class="arrow" d="M1295 490 L1295 530"/>
  <path class="arrow" d="M1295 600 L1295 640"/>
  <path class="arrow" d="M1295 710 L1295 765"/>

  <text x="80" y="1035" class="note">主要來源：MainActivity.kt、FarmlandInspectionDatabase.kt、FarmerLocalStore.kt、RoutePlanner.kt、RoadRouteService.kt、CwaWeatherService.kt</text>
  <text x="80" y="1062" class="note">README 引用：![BauhausRoute 架構圖](./bauhausroute-architecture.svg)</text>
</svg>
